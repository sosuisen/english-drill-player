<svg xmlns="http://www.w3.org/2000/svg" width="1472" height="1042.88"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="black" flood-opacity="0.2"/></filter></defs><rect width="1472" height="1042.88" fill="white"/><text x="16" y="67.44" font-family="sans-serif" font-size="32" font-weight="bold">English Drill Player</text><text x="16" y="113.880005" font-family="sans-serif" font-size="16">「復習」は大事なのであえて一番最後のアクティビティに分けてある。</text><text x="16" y="149.88" font-family="sans-serif" font-size="16">ファイル（ユニット）には複数のドリルが含まれるものとする。</text><text x="16" y="185.88" font-family="sans-serif" font-size="16">ユーザータイプは「英語学習者」のみ。「先生」がいると有難いが・・。</text><rect id="band-0" x="16" y="206.88" width="1440" height="68" fill="#e0efff"/><line x1="16" y1="273.88" x2="1456" y2="273.88" stroke="#bedeff" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-1" x="16" y="274.88" width="1440" height="48" fill="#e0ffee"/><line x1="16" y1="321.88" x2="1456" y2="321.88" stroke="#beffdc" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-2" x="16" y="322.88" width="1440" height="64" fill="#ffe0e9"/><line x1="16" y1="385.88" x2="1456" y2="385.88" stroke="#ffbed1" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-3" x="16" y="386.88" width="1440" height="376" fill="#fff3e0"/><line x1="16" y1="761.88" x2="1456" y2="761.88" stroke="#ffe6be" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-4" x="16" y="762.88" width="1440" height="88" fill="#fffaf3"/><line x1="16" y1="849.88" x2="1456" y2="849.88" stroke="#ffe6be" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-5" x="16" y="850.88" width="1440" height="88" fill="#fff3e0"/><line x1="16" y1="937.88" x2="1456" y2="937.88" stroke="#ffe6be" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-6" x="16" y="938.88" width="1440" height="88" fill="#fffaf3"/><line x1="16" y1="1025.88" x2="1456" y2="1025.88" stroke="#ffe6be" stroke-width="2" stroke-dasharray="6 6"/><text x="32" y="233.88" font-family="sans-serif" font-size="16" fill="#888888">アクティビティ</text><text x="32" y="301.88" font-family="sans-serif" font-size="16" fill="#888888">タスク</text><text x="32" y="349.88" font-family="sans-serif" font-size="16" fill="#888888">ウォーキングスケルトン</text><text x="32" y="413.88" font-family="sans-serif" font-size="16" fill="#888888">実際に利用可能</text><text x="32" y="789.88" font-family="sans-serif" font-size="16" fill="#888888">苦手ドリルの練習強化</text><text x="32" y="877.88" font-family="sans-serif" font-size="16" fill="#888888">ドリル2周目以降の対応</text><text x="32" y="965.88" font-family="sans-serif" font-size="16" fill="#888888">発音練習の強化</text><rect id="card-0" x="233" y="215.88" width="158" height="50" rx="6" fill="#bedeff" stroke="#208cff" stroke-width="2"/><text x="242" y="235.88" font-family="sans-serif" font-size="16">準備する</text><rect id="card-0-tag-0" x="246" y="243.08" width="76" height="16" rx="8" fill="white"/><text x="252" y="255.88" font-family="sans-serif" font-size="12.8">英語学習者</text><rect id="card-1" x="233" y="283.88" width="158" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="242" y="303.88" font-family="sans-serif" font-size="16">ドリルを登録</text><rect id="card-2" x="232" y="330.88" width="160" height="48" rx="6" fill="#ffbed1"/><text x="240" y="349.88" font-family="sans-serif" font-size="16">✅ 決められた音声</text><text x="240" y="369.88" font-family="sans-serif" font-size="16">フォルダで始める</text><rect id="card-3" x="232" y="394.88" width="160" height="68" rx="6" fill="#ffe6be"/><text x="240" y="413.88" font-family="sans-serif" font-size="16">✅ 音声フォルダを</text><text x="240" y="433.88" font-family="sans-serif" font-size="16">自由に1つ登録する</text><rect id="card-4" x="233" y="859.88" width="158" height="70" rx="6" fill="#ffe6be" stroke="#ffa920" stroke-width="2"/><text x="242" y="879.88" font-family="sans-serif" font-size="16">2つ目以降のフォル</text><text x="242" y="899.88" font-family="sans-serif" font-size="16">ダを追加する</text><rect id="card-5" x="409" y="215.88" width="158" height="50" rx="6" fill="#bedeff" stroke="#208cff" stroke-width="2"/><text x="418" y="235.88" font-family="sans-serif" font-size="16">ドリルを実行する</text><rect id="card-5-tag-0" x="422" y="243.08" width="76" height="16" rx="8" fill="white"/><text x="428" y="255.88" font-family="sans-serif" font-size="12.8">英語学習者</text><rect id="card-6" x="409" y="283.88" width="158" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="418" y="303.88" font-family="sans-serif" font-size="16">ドリルを探す</text><rect id="card-7" x="408" y="330.88" width="160" height="48" rx="6" fill="#ffbed1"/><text x="416" y="349.88" font-family="sans-serif" font-size="16">✅ ユニット一覧か</text><text x="416" y="369.88" font-family="sans-serif" font-size="16">ら探す</text><rect id="card-8" x="409" y="771.88" width="158" height="70" rx="6" fill="#ffe6be" stroke="#ffa920" stroke-width="2"/><text x="418" y="791.88" font-family="sans-serif" font-size="16">苦手なドリルから</text><text x="418" y="811.88" font-family="sans-serif" font-size="16">探す</text><rect id="card-9" x="585" y="283.88" width="158" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="594" y="303.88" font-family="sans-serif" font-size="16">ドリルを再生する</text><rect id="card-10" x="584" y="330.88" width="160" height="48" rx="6" fill="#ffbed1"/><text x="592" y="349.88" font-family="sans-serif" font-size="16">✅ ドリルの音声を</text><text x="592" y="369.88" font-family="sans-serif" font-size="16">最後まで再生する</text><rect id="card-11" x="584" y="394.88" width="160" height="68" rx="6" fill="#ffe6be"/><text x="592" y="413.88" font-family="sans-serif" font-size="16">✅ 現在再生中のド</text><text x="592" y="433.88" font-family="sans-serif" font-size="16">リルをリストで確</text><text x="592" y="453.88" font-family="sans-serif" font-size="16">認できる</text><rect id="card-12" x="584" y="478.88" width="160" height="88" rx="6" fill="#ffe6be"/><text x="592" y="497.88" font-family="sans-serif" font-size="16">✅ ドリルをクリッ</text><text x="592" y="517.88" font-family="sans-serif" font-size="16">クすると、ドリル</text><text x="592" y="537.88" font-family="sans-serif" font-size="16">冒頭から再生でき</text><text x="592" y="557.88" font-family="sans-serif" font-size="16">る</text><rect id="card-13" x="584" y="582.88" width="160" height="68" rx="6" fill="#ffe6be"/><text x="592" y="601.88" font-family="sans-serif" font-size="16">✅ ひとつ前、ひと</text><text x="592" y="621.88" font-family="sans-serif" font-size="16">つ次のドリルから</text><text x="592" y="641.88" font-family="sans-serif" font-size="16">再生する</text><rect id="card-14" x="584" y="666.88" width="160" height="88" rx="6" fill="#ffe6be"/><text x="592" y="685.88" font-family="sans-serif" font-size="16">✅ ユニットをダブ</text><text x="592" y="705.88" font-family="sans-serif" font-size="16">ルクリックする</text><text x="592" y="725.88" font-family="sans-serif" font-size="16">と、先頭のドリル</text><text x="592" y="745.88" font-family="sans-serif" font-size="16">から再生する</text><rect id="card-15" x="761" y="283.88" width="158" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="770" y="303.88" font-family="sans-serif" font-size="16">再生を制御する</text><rect id="card-16" x="760" y="394.88" width="160" height="68" rx="6" fill="#ffe6be"/><text x="768" y="413.88" font-family="sans-serif" font-size="16">✅ 一時停止、再</text><text x="768" y="433.88" font-family="sans-serif" font-size="16">開、停止できる</text><rect id="card-17" x="761" y="771.88" width="158" height="70" rx="6" fill="#ffe6be" stroke="#ffa920" stroke-width="2"/><text x="770" y="791.88" font-family="sans-serif" font-size="16">再生速度を変え</text><text x="770" y="811.88" font-family="sans-serif" font-size="16">て、ゆっくりまた</text><text x="770" y="831.88" font-family="sans-serif" font-size="16">は速く聞く</text><rect id="card-18" x="937" y="215.88" width="158" height="50" rx="6" fill="#bedeff" stroke="#208cff" stroke-width="2"/><text x="946" y="235.88" font-family="sans-serif" font-size="16">チェックする</text><rect id="card-18-tag-0" x="950" y="243.08" width="76" height="16" rx="8" fill="white"/><text x="956" y="255.88" font-family="sans-serif" font-size="12.8">英語学習者</text><rect id="card-19" x="937" y="283.88" width="158" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="946" y="303.88" font-family="sans-serif" font-size="16">進度を確認する</text><rect id="card-20" x="936" y="330.88" width="160" height="48" rx="6" fill="#ffbed1"/><text x="944" y="349.88" font-family="sans-serif" font-size="16">✅ 最終再生日時を</text><text x="944" y="369.88" font-family="sans-serif" font-size="16">確認できる</text><rect id="card-21" x="937" y="771.88" width="158" height="70" rx="6" fill="#ffe6be" stroke="#ffa920" stroke-width="2"/><text x="946" y="791.88" font-family="sans-serif" font-size="16">苦手なドリルに苦</text><text x="946" y="811.88" font-family="sans-serif" font-size="16">手チェックを入れ</text><text x="946" y="831.88" font-family="sans-serif" font-size="16">る</text><rect id="card-22" x="937" y="859.88" width="158" height="70" rx="6" fill="#ffe6be" stroke="#ffa920" stroke-width="2"/><text x="946" y="879.88" font-family="sans-serif" font-size="16">終えたドリルに完</text><text x="946" y="899.88" font-family="sans-serif" font-size="16">了チェックを入れ</text><text x="946" y="919.88" font-family="sans-serif" font-size="16">る</text><rect id="card-23" x="1113" y="283.88" width="158" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="1122" y="303.88" font-family="sans-serif" font-size="16">発音を確認する</text><rect id="card-24" x="1113" y="947.88" width="158" height="70" rx="6" fill="#ffe6be" stroke="#ffa920" stroke-width="2"/><text x="1122" y="967.88" font-family="sans-serif" font-size="16">自分の発音を録音</text><text x="1122" y="987.88" font-family="sans-serif" font-size="16">し、手本の音声と</text><text x="1122" y="1007.88" font-family="sans-serif" font-size="16">聞き比べる</text><rect id="card-25" x="1289" y="215.88" width="158" height="50" rx="6" fill="#bedeff" stroke="#208cff" stroke-width="2"/><text x="1298" y="235.88" font-family="sans-serif" font-size="16">復習する</text><rect id="card-25-tag-0" x="1302" y="243.08" width="76" height="16" rx="8" fill="white"/><text x="1308" y="255.88" font-family="sans-serif" font-size="12.8">英語学習者</text><rect id="card-26" x="1289" y="283.88" width="158" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="1298" y="303.88" font-family="sans-serif" font-size="16">前回の復習をする</text><rect id="card-27" x="1288" y="330.88" width="160" height="48" rx="6" fill="#ffbed1"/><text x="1296" y="349.88" font-family="sans-serif" font-size="16">✅ 前回終えたユ</text><text x="1296" y="369.88" font-family="sans-serif" font-size="16">ニットを繰り返す</text><rect id="card-28" x="1289" y="771.88" width="158" height="70" rx="6" fill="#ffe6be" stroke="#ffa920" stroke-width="2"/><text x="1298" y="791.88" font-family="sans-serif" font-size="16">苦手チェックした</text><text x="1298" y="811.88" font-family="sans-serif" font-size="16">ドリルを繰り返す</text></svg>