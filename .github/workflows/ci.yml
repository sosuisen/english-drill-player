name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # bash on every OS. PowerShell splits -Dname.key=value at the dot.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Check formatting
        run: mvn -B formatter:validate

      # "package" runs the tests and then jpackage.
      # The native image goes to target/jpackage/.
      # One test JVM at a time: parallel JVMs extract the JavaFX native
      # libraries to the same cache and one of them reads a half-written file.
      - name: Test and build native image
        run: mvn -B package -Dsurefire.forkCount=1

      - uses: actions/upload-artifact@v7
        with:
          name: english-drill-player-${{ runner.os }}
          path: target/jpackage/
          if-no-files-found: error
