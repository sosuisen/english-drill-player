name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: linux-x64.tar.gz
          - os: windows-latest
            archive: windows-x64.zip
          - os: macos-latest
            archive: macos-aarch64.dmg
    steps:
      - uses: actions/checkout@v7

      # The tag is the only source of the version.
      # "v1.2.3" becomes "1.2.3". jpackage needs this X.Y.Z form.
      - name: Read the version from the tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' must look like vX.Y.Z"
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # A tag can point at any commit, so the tests run again here.
      - name: Test and build native image
        run: mvn -B package -Dapp.version=${{ env.APP_VERSION }}

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "english-drill-player-${APP_VERSION}-${{ matrix.archive }}" -C target/jpackage english-drill-player

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/jpackage/english-drill-player -DestinationPath "english-drill-player-$env:APP_VERSION-${{ matrix.archive }}"

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: mv target/jpackage/*.dmg "english-drill-player-${APP_VERSION}-${{ matrix.archive }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: english-drill-player-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
